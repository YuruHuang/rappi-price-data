# =============================================================================
# Rappi COLOMBIA tobacco/nicotine lexicon  (es-CO)
# =============================================================================
# Used by rappi_co/classify/tobacco_classifier.py. Matching: lowercase + strip
# accents + collapse separators, then word-boundary match on name+brand+section.
# Scope: cigarettes/cigars/rolling/vapes/pods/e-liquid/heated/pouches + NRT +
# zero-nic vapes are IN. Paraphernalia + candy cigarettes are OUT (but tagged).
#
# LOCALIZATION NOTES (Colombian market):
#   - Generic Spanish terms (cigarrillo, tabaco, vape, nicotina, ...) are language-wide.
#   - Cigarette BRANDS target the Colombian market: distinctive brands
#     (Pielroja, Marlboro, ...) go in tobacco_safe; collision-prone brand words that
#     are also everyday words (Boston, Caribe, Premier, Mustang, Belmont, Kool) go in
#     tobacco_context_required, so they only count as tobacco WITH corroboration.
#   - VERIFY tobacco_sections aisle names + add brands after reviewing the first
#     live scrape's catalog vocabulary.
# =============================================================================

