# broad relevance filter for the DEEPEN crawl: which aisles to paginate to full depth.
# recall-first — err toward including an aisle; the classifier (downstream) does the precise
# labeling. covers the three sin-tax categories: tobacco/nicotine, alcohol, non-alcoholic beverages.
# used by the content spider (name trigger = aisle name; content trigger = first-page item text)
# and by the search audit (seed terms). matching is lowercase + accent-stripped substring.

# --- aisle NAME trigger: an aisle whose name contains any of these is deep-paginated ---
relevance_sections:
  # tobacco / nicotine
  - cigarrillo
  - tabaco
  - tabaqueria
  - cigarreria
  - cigarro
  - puros
  - vaporizador
  - vapeo
  - vape
  - riesgo reducido
  - productos de tabaco
  - nicotina
  - sin humo
  - shisha
  - hookah
  - narguile
  - cachimba
  - fumador
  # alcohol
  - licor
  - cerveza
  - vino
  - aguardiente
  - whisky
  - whiskey
  - ron
  - vodka
  - ginebra
  - tequila
  - aperitivo
  - espumante
  - espumoso
  - champana
  - sidra
  - vermut
  - sake
  - destilado
  - coctel
  - bebidas alcoholicas
  # non-alcoholic beverages
  - bebida
  - gaseosa
  - refresco
  - jugo
  - nectar
  - agua
  - energizante
  - hidratante
  - isotonico
  - te helado
  - bebidas
  - hidratacion

