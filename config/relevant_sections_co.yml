# --- search seed queries (Rappi unified-search, per address) ---
# these DRIVE collection (search backbone) — generics first, then a few unambiguous brand/variant
# terms to lift recall on products search didn't surface under the generics. keep terms specific
# enough not to pull obvious noise (e.g. "vape pod", not bare "pod" which returns coffee pods).
search_terms:
  # tobacco / nicotine
  - cigarrillos
  - tabaco
  - cigarro
  - puros
  - cigarrillo electronico
  - vape
  - vapeador
  - vaper
  - vape pod
  - nicotina
  - bolsas de nicotina
  - hookah
  - shisha
  - elf bar
  - chesterfield
  - rothmans
  # alcohol
  - licor
  - cerveza
  - vino
  - aguardiente
  - whisky
  - ron
  # non-alcoholic beverages
  - gaseosa
  - jugo
